
name: Git Bonsai

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pin the generator so the tree and its calculations only change when
      # deliberately upgraded. One metrics snapshot feeds the README and site.
      - name: Checkout Git Bonsai
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: egorthinks/git-bonsai
          ref: bec04c39f62731fdb28c3b82322ef21cbf3bdfac
          path: .git-bonsai-source
          persist-credentials: false

      - name: Generate Git Bonsai and statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BONSAI_USER: george-cliff
          BONSAI_SOURCE_REF: main
        run: node .github/scripts/generate_bonsai.mjs

      - name: Commit changes
        run: |
          git config user.name 'git-bonsai[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/bonsai.svg output/bonsai.png output/bonsai.gif output/bonsai-growth.gif output/bonsai-data.json
          if git diff --cached --quiet; then
            echo "Bonsai unchanged — nothing to commit"
          else
            git commit -m 'chore: tend the bonsai 🌳'
            git pull --rebase
            git push
          fi
