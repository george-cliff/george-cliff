name: GitHub stats

on:
  schedule:
    - cron: '15 3 * * *' # UTC; 15 mins after Bonsai, 15 mins before WakaTime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GH_TOKEN is a personal access token, so private repositories and
      # contributions are counted, unlike the public-only badge services.
      - name: Generate stats badges
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 .github/scripts/github_stats.py output/github-stats.svg

      - name: Commit changes
        run: |
          git config user.name 'readme-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/github-stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'chore: count the contributions 🧮'
            git pull --rebase
            git push
          fi
