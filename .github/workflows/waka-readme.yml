name: WakaTime coding stats

on:
  schedule:
    - cron: '45 4 * * *' # UTC; avoids overlapping with the Bonsai workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The action can only write to README.md, so run it in debug mode, which
      # returns the stats as a step output instead of committing them.
      - name: Generate coding activity
        id: waka
        uses: anmol098/waka-readme-stats@master
        env:
          DEBUG_RUN: 'True'
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BADGE_STYLE: 'flat-square'
          SHOW_TOTAL_CODE_TIME: 'False'
          SHOW_LANGUAGE: 'True'
          SHOW_EDITORS: 'True'
          SHOW_OS: 'True'
          SHOW_PROJECTS: 'False'
          SHOW_TIMEZONE: 'False'
          SHOW_COMMIT: 'True'
          SHOW_DAYS_OF_WEEK: 'False'
          SHOW_LANGUAGE_PER_REPO: 'True'
          SHOW_LOC_CHART: 'False'
          SHOW_PROFILE_VIEWS: 'False'
          SHOW_SHORT_INFO: 'False'
          SHOW_UPDATED_DATE: 'False'
          SHOW_AI_CODE_TIME: 'False'
          SHOW_AI_CODING: 'False'

      - name: Write coding-stats.md
        env:
          STATS: ${{ steps.waka.outputs.README_CONTENT }}
        run: |
          if [ -z "$STATS" ]; then
            echo "No stats were returned by the action" >&2
            exit 1
          fi
          {
            echo '# 📊 Coding stats'
            echo
            echo '_Updated daily from WakaTime and GitHub · [back to profile](README.md)_'
            echo
            # Drop the action's "README stats current output:" line and the blank line after it
            printf '%s\n' "$STATS" | sed '1,2{/^README stats current output:$/d;/^$/d}'
          } > coding-stats.md

      - name: Commit changes
        run: |
          git config user.name 'readme-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coding-stats.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'Updated with Dev Metrics'
            git push
          fi
